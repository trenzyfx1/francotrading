<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing Demo Payment — Franco Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Franco Trading — Christmas Giveaway (Academic Demo)
   =========================================================== */

:root{
  --navy-deep:   #0b1a3d;
  --navy:        #0f2152;
  --navy-light:  #1a2f68;
  --gold:        #f4b740;
  --gold-light:  #ffd97a;
  --cream:       #fdf6e8;
  --ink:         #10162b;
  --muted:       #6b7390;
  --line:        #e4e7f1;
  --success:     #2e9e5b;
  --danger:      #d8475f;

  --font-display: 'Fraunces', serif;
  --font-body: 'Manrope', sans-serif;

  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;

  --shadow-soft: 0 16px 40px rgba(11,26,61,0.14);
  --shadow-card: 0 6px 18px rgba(11,26,61,0.08);
}

*,*::before,*::after{ box-sizing: border-box; }
html,body{ height:auto; }
body{
  margin:0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
input, select, textarea{ font-family:inherit; }

.container{
  width:100%;
  max-width: 1140px;
  margin:0 auto;
  padding: 0 24px;
}

/* ---------- Header ---------- */
.site-header{
  background: var(--navy);
  color:#fff;
  padding: 16px 0;
}
.site-header .container{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 24px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size: 1.05rem;
  letter-spacing: .01em;
  color:#fff;
}
.brand .mark{
  width:34px; height:34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--gold), #e08a2e);
  display:flex; align-items:center; justify-content:center;
  color: var(--navy-deep);
  font-family: var(--font-display);
  font-weight:700;
  font-size:1.1rem;
}
.brand .name small{
  display:block;
  font-weight:600;
  font-size: 0.62rem;
  letter-spacing: .14em;
  color: var(--gold-light);
}

/* ---------- Processing page ---------- */
.processing-wrap{
  min-height: 80vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(180deg, var(--navy-deep), #122659);
}
.processing-card{
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(244,183,64,0.25);
  border-radius: var(--radius-lg);
  padding: 48px 44px;
  text-align:center;
  color:#fff;
  max-width: 420px;
  width: 100%;
}
.spinner{
  width: 58px; height:58px;
  margin: 0 auto 26px;
  border-radius:50%;
  border: 4px solid rgba(244,183,64,0.2);
  border-top-color: var(--gold);
  animation: spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.processing-card h2{
  font-family: var(--font-display);
  font-weight:600;
  margin: 0 0 8px;
}
.processing-card p{ color: rgba(255,255,255,0.72); margin:0 0 22px; }
.progress-track{
  height: 8px;
  background: rgba(255,255,255,0.12);
  border-radius: 999px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 999px;
  transition: width 0.2s linear;
}
.processing-pct{
  margin-top:10px;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.6);
  font-variant-numeric: tabular-nums;
}

:focus-visible{ outline: 3px solid var(--navy-light); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <span class="mark" aria-hidden="true">F</span>
      <span class="name">FRANCO TRADING ENTERPRISE<small>SECURE &amp; TRUSTED</small></span>
    </div>
  </div>
</header>

<div class="processing-wrap">
  <div class="processing-card">
    <div class="spinner" role="status" aria-label="Processing"></div>
    <h2>Hold on a moment</h2>
    <p>Your demonstration payment is being processed.</p>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="processing-pct" id="progress-pct">0%</div>
  </div>
</div>

<script>
/* ===========================================================
   Franco Trading — Processing Logic
   =========================================================== */

// Changed duration to exactly 30 seconds (30,000 ms)
const DURATION_MS = 30000; 
const fill = document.getElementById("progress-fill");
const pct = document.getElementById("progress-pct");
const start = Date.now();

function tick(){
  const elapsed = Date.now() - start;
  const ratio = Math.min(elapsed / DURATION_MS, 1);
  
  fill.style.width = (ratio * 100).toFixed(1) + "%";
  pct.textContent = Math.floor(ratio * 100) + "%";

  if (ratio < 1) {
    requestAnimationFrame(tick);
  } else {
    // Optional: Clear the state so they can't refresh and get stuck in processing
    sessionStorage.removeItem("franco_demo_state");
    window.location.href = "confirmation.html";
  }
}
requestAnimationFrame(tick);
</script>
</body>
</html>
